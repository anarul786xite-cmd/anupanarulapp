name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o .github/workflows/AnarulAnupAndroid_Project.zip -d extracted
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          cd extracted
          PROJECT_DIR=$(find . -name gradlew -type f -printf '%h\n' | head -1)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnarulAnup-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
